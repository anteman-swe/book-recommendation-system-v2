services:
  backend:
    build:
      context: backend
      dockerfile: Containerfile
    ports:
      - :8080:8080
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: book_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:-book_password}
    depends_on:
      - app
      - postgres

  app:
    build: 
      context: ml_module
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: book_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:-book_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_SECONDS: 3600
    depends_on:
      - postgres
      - redis

  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_DB: book_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-book_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: docker.io/library/redis:8.8.3
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data: